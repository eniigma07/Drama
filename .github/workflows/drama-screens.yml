name: Drama - przegląd ekranów (emulator)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/screens/**
      - .github/workflows/drama-screens.yml

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Najnowsze APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk -p Drama.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/screens/run.sh
      - name: Zrzuty do release "zrzuty"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view zrzuty >/dev/null 2>&1 || gh release create zrzuty --prerelease --latest=false --title "Zrzuty ekranu (test)" --notes "Automatyczny przegląd ekranów."
          gh release upload zrzuty shots/* --clobber
